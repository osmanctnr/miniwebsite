<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Genel Kültür Quiz 🧠</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .quiz-box {
            max-width: 750px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 35px;
            backdrop-filter: blur(10px);
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: #cbd5e1;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: white;
            transition: 0.3s;
        }

        #question {
            font-size: 26px;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .answers {
            display: grid;
            gap: 14px;
        }

        .answer {
            padding: 17px;
            border-radius: 13px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .answer:hover {
            background: rgba(255,255,255,0.14);
            transform: translateX(4px);
        }

        .answer.correct {
            background: rgba(34,197,94,0.35);
            border-color: #22c55e;
        }

        .answer.wrong {
            background: rgba(239,68,68,0.35);
            border-color: #ef4444;
        }

        #nextBtn,
        #restartBtn,
        #homeBtn {
            margin-top: 25px;
            padding: 13px 22px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        #nextBtn {
            display: none;
        }

        #result {
            display: none;
            text-align: center;
        }
