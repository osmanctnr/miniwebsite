<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
<title>Sayı Tahmin 🎯</title>
<link
    rel="stylesheet"
    href="style.css">
<style>
/* SAYI TAHMİN ÖZEL ALANI */
.number-display {
    text-align: center;
    margin: 25px 0;
}
.range-text {
    color: #94a3b8;
    margin-bottom: 15px;
}
.guess-input {
    text-align: center;
    font-size: 24px;
}
.guess-button {
    width: 100%;
    margin-top: 12px;
}
.hint {
    min-height: 32px;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    margin: 20px 0;
}
.attempts {
    text-align: center;
    color: #94a3b8;
}
</style>
</head>
<body>
<div class="game-container">
<div id="game">
<h1>🎯 Sayı Tahmin</h1>
<p
    style="
    text-align:center;
    color:#94a3b8;
    line-height:1.5;
    ">
    1 ile 100 arasında gizli bir sayı tuttum.
    <br>
    Bakalım kaç denemede bulabileceksin?
</p>
<div class="number-display">
    <div class="range-text">
        🔢 1 — 100
    </div>
    <input
        type="number"
        id="guessInput"
        class="guess-input"
        min="1"
        max="100"
        placeholder="Tahminin"
    >
    <button
        class="guess-button guess-btn"
        onclick="checkGuess()">
        Tahmin Et 🎯
    </button>
</div>
<div
    class="hint"
    id="hint">
    Bir sayı gir ve başlayalım!
</div>
<div
    class="attempts"
    id="attempts">
    Deneme: 0
</div>
<button
    class="home"
    onclick="location.href='index.html'">
    🏠 Ana Sayfa
</button>
</div>
<!-- SONUÇ -->
<div
    id="result"
    class="result hidden">
<h1>🎯 Tebrikler!</h1>
<h2>
    Sayıyı Buldun!
</h2>
<div
    class="final-score"
    id="finalAttempts">
    0
</div>
<p>
    denemede doğru sayıyı buldun.
</p>
<p class="record">
    🏆 En iyi rekor:
    <span id="bestRecord">
        -
    </span>
</p>
<button
    class="restart"
    onclick="restartGame()">
    🔄 Tekrar Oyna
</button>
<button
    class="home"
    onclick="location.href='index.html'">
    🏠 Ana Sayfa
</button>
</div>
</div>
<script>
let secretNumber =
    Math.floor(Math.random() * 100) + 1;
let attempts = 0;
let gameOver = false;
const guessInput =
    document.getElementById("guessInput");
const hint =
    document.getElementById("hint");
const attemptsText =
    document.getElementById("attempts");
function checkGuess() {
    if (gameOver) return;
    const guess =
        Number(guessInput.value);
    if (
        !guess ||
        guess < 1 ||
        guess > 100
    ) {
        hint.textContent =
            "⚠️ 1 ile 100 arasında bir sayı gir.";
        return;
    }
    attempts++;
    attemptsText.textContent =
        `Deneme: ${attempts}`;
    if (guess === secretNumber) {
        gameOver = true;
        hint.textContent =
            "🎉 Doğru tahmin!";
        document
            .getElementById("game")
            .classList
            .add("hidden");
        document
            .getElementById("result")
            .classList
            .remove("hidden");
        document
            .getElementById("finalAttempts")
            .textContent =
            attempts;
        let record =
            Number(
                localStorage.getItem(
                    "guessRecord"
                )
            ) || 0;
        if (
            record === 0 ||
            attempts < record
        ) {
            record = attempts;
            localStorage.setItem(
                "guessRecord",
                record
            );
        }
        document
            .getElementById("bestRecord")
            .textContent =
            record + " deneme";
        return;
    }
    if (guess < secretNumber) {
        hint.textContent =
            "⬆️ Daha büyük bir sayı dene!";
    } else {
        hint.textContent =
            "⬇️ Daha küçük bir sayı dene!";
    }
    guessInput.value = "";
    guessInput.focus();
}
guessInput.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            checkGuess();
        }
    }
);
function restartGame() {
    secretNumber =
        Math.floor(Math.random() * 100) + 1;
    attempts = 0;
    gameOver = false;
    document
        .getElementById("result")
        .classList
        .add("hidden");
    document
        .getElementById("game")
        .classList
        .remove("hidden");
    hint.textContent =
        "Bir sayı gir ve başlayalım!";
    attemptsText.textContent =
        "Deneme: 0";
    guessInput.value = "";
    guessInput.focus();
}
</script>
</body>
</html>
