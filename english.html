<script>

let level = "easy";
let words = [];
let current = 0;
let score = 0;
let answered = false;


/* KELİMELERİ KARIŞTIR */

function shuffle(array) {

    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [result[i], result[j]] =
            [result[j], result[i]];
    }

    return result;
}


/* DAHA ÖNCE GÖRÜLEN KELİMELER */

function getSeenWords() {

    const saved =
        localStorage.getItem(
            "englishSeen_" + level
        );

    if (!saved) return [];

    try {
        return JSON.parse(saved);
    } catch {
        return [];
    }
}


/* KELİMEYİ GÖRÜLDÜ OLARAK KAYDET */

function markAsSeen(word) {

    const seen = getSeenWords();

    if (!seen.includes(word)) {

        seen.push(word);

        localStorage.setItem(
            "englishSeen_" + level,
            JSON.stringify(seen)
        );
    }
}


/* YENİ TUR OLUŞTUR */

function createRound() {

    const allWords =
        englishWords[level];

    let seen =
        getSeenWords();


    let available =
        allWords.filter(word =>
            !seen.includes(word[0])
        );


    /*
       Yeterli yeni kelime varsa
       sadece daha önce görülmeyenlerden seç.
    */

    if (available.length >= 10) {

        words =
            shuffle(available).slice(0, 10);

    } else if (available.length > 0) {

        /*
           Son kalan kelimeleri kullan.
        */

        words =
            shuffle(available);

    } else {

        /*
           Bu seviyedeki bütün kelimeler
           tüketildiyse yeni döngü başlat.
        */

        localStorage.removeItem(
            "englishSeen_" + level
        );

        words =
            shuffle([...allWords]).slice(0, 10);
    }


    /*
       Seçilen kelimeleri kaydet.
    */

    words.forEach(word =>
        markAsSeen(word[0])
    );


    updateRemaining();
}


/* KALAN KELİME SAYISI */

function updateRemaining() {

    const total =
        englishWords[level].length;

    const seen =
        getSeenWords().length;

    const remaining =
        Math.max(0, total - seen);

    document.getElementById("remaining")
        .textContent =
        `Bu seviyede daha önce görülmemiş ${remaining} kelime kaldı.`;
}
