<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
<title>İngilizce Kelime 🇬🇧</title>
<link
    rel="stylesheet"
    href="style.css">
<style>
.level-select {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 25px 0;
}
.level-btn {
    background: rgba(255,255,255,0.06);
    color: white;
    border: 1px solid rgba(255,255,255,0.08);
}
.level-btn:hover {
    border-color: #22d3ee;
    background: rgba(34,211,238,0.10);
}
.level-btn.active {
    background: linear-gradient(
        90deg,
        #22d3ee,
        #60a5fa
    );
    color: #031018;
}
.word-box {
    text-align: center;
    padding: 30px 20px;
    margin-bottom: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
}
.word {
    font-size: 38px;
    font-weight: 800;
    color: #22d3ee;
}
.word-info {
    color: #94a3b8;
    margin-top: 8px;
}
@media (max-width: 600px) {
    .level-select {
        grid-template-columns: 1fr;
    }
    .word {
        font-size: 32px;
    }
}
</style>
</head>
<body>
<div class="game-container">
<!-- SEVİYE SEÇİMİ -->
<div id="levelScreen">
    <h1>🇬🇧 İngilizce Kelime</h1>
    <p
        style="
        text-align:center;
        color:#94a3b8;
        line-height:1.5;
        ">
        Seviyeni seç ve kelime bilgini test et!
    </p>
    <div class="level-select">
        <button
            class="level-btn"
            onclick="setLevel('easy', this)">
            🟢 Kolay
        </button>
        <button
            class="level-btn"
            onclick="setLevel('medium', this)">
            🟡 Orta
        </button>
        <button
            class="level-btn"
            onclick="setLevel('hard', this)">
            🔴 Zor
        </button>
    </div>
    <button
        class="home"
        onclick="location.href='index.html'">
        🏠 Ana Sayfa
    </button>
</div>
<!-- OYUN -->
<div
    id="quiz"
    class="hidden">
<h1>🇬🇧 İngilizce Kelime</h1>
<div class="top">
    <span id="questionNumber">
        Soru 1 / 10
    </span>
    <span id="scoreText">
        Skor: 0
    </span>
</div>
<div class="progress-bg">
    <div
        class="progress"
        id="progress">
    </div>
</div>
<div class="word-box">
    <div
        class="word"
        id="word">
    </div>
    <div class="word-info">
        Türkçe anlamını seç
    </div>
</div>
<div
    class="answers"
    id="answers">
</div>
<div id="feedback"></div>
<button
    id="nextBtn"
    class="next-btn hidden"
    onclick="nextQuestion()">
    Sonraki Soru →
</button>
</div>
<!-- SONUÇ -->
<div
    id="result"
    class="result hidden">
<h1>🇬🇧 Quiz Bitti!</h1>
<div
    class="final-score"
    id="finalScore">
    0 / 10
</div>
<p id="message"></p>
<p class="record">
    🏆 En yüksek skorun:
    <span id="highScore">
        0
    </span>
    / 10
</p>
<button
    class="restart"
    onclick="restartQuiz()">
    🔄 Tekrar Oyna
</button>
<button
    class="home"
    onclick="location.href='index.html'">
    🏠 Ana Sayfa
</button>
</div>
</div>
<script>
const words = {
    easy: [

        },
        {

    ],

        },
        {

        },

        {

            ],

        },
        {

            ],
            correct: "Bununla birlikte"
        },
        {
            word: "Reluctant",

                "İsteksiz",
                "Kararlı",
                "Meraklı",
                "Cesur"
            ],
            correct: "İsteksiz"
        },
        {
            word: "Substantial",
            answers: [
                "Önemsiz",

            ],

        },
        {
            word: "Inevitable",
            answers: [
                "Kaçınılmaz",

            ],
            correct: "Kaçınılmaz"
        },
        {

                "Tartışmalı",
                "Kesin",

            ],

        },
        {

            answers: [
                "Dikkatsiz",

            ],

        },
        {
            word: "Convey",
            answers: [
                "İletmek",
                "Gizlemek",
                "Reddetmek",
                "Unutmak"
            ],
            correct: "İletmek"
        },
        {
            word: "Predominantly",
            answers: [
                "Tamamen",
                "Büyük ölçüde",
                "Nadiren",
                "Kesinlikle"
            ],
            correct: "Büyük ölçüde"
        },
        {
            word: "Deteriorate",
            answers: [
                "İyileşmek",
                "Kötüleşmek",
                "Değiştirmek",
                "Başlamak"
            ],
            correct: "Kötüleşmek"
        }
    ]
};
let selectedLevel = "";
let currentQuestion = 0;
let score = 0;
let answered = false;
function setLevel(level, button) {
    selectedLevel = level;
    currentQuestion = 0;
    score = 0;
    document
        .querySelectorAll(".level-btn")
        .forEach(btn => {
            btn.classList.remove("active");
        });
    button.classList.add("active");
    document
        .getElementById("levelScreen")
        .classList
        .add("hidden");
    document
        .getElementById("quiz")
        .classList
        .remove("hidden");
    loadQuestion();
}
function loadQuestion() {
    answered = false;
    document
        .getElementById("nextBtn")
        .classList
        .add("hidden");
    document
        .getElementById("feedback")
        .textContent = "";
    const q =
        words[selectedLevel][currentQuestion];
    document
        .getElementById("questionNumber")
        .textContent =
        `Soru ${currentQuestion + 1} / 10`;
    document
        .getElementById("scoreText")
        .textContent =
        `Skor: ${score}`;
    document
        .getElementById("progress")
        .style.width =
        `${(currentQuestion / 10) * 100}%`;
    document
        .getElementById("word")
        .textContent =
        q.word;
    const answers =
        document.getElementById("answers");
    answers.innerHTML = "";
    q.answers.forEach(answer => {
        const button =
            document.createElement("button");
        button.textContent =
            answer;
        button.classList.add("answer");
        button.onclick =
            () => checkAnswer(button, answer);
        answers.appendChild(button);
    });
}
function checkAnswer(button, answer) {
    if (answered) return;
    answered = true;
    const q =
        words[selectedLevel][currentQuestion];
    document
        .querySelectorAll(".answer")
        .forEach(btn => {
            if (
                btn.textContent === q.correct
            ) {
                btn.classList.add("correct");
            }
        });
    if (answer === q.correct) {
        score++;
        button.classList.add("correct");
        document
            .getElementById("feedback")
            .textContent =
            "✅ Doğru!";
    } else {
        button.classList.add("wrong");
        document
            .getElementById("feedback")
            .textContent =
            `❌ Yanlış! Doğru cevap: ${q.correct}`;
    }
    document
        .getElementById("scoreText")
        .textContent =
        `Skor: ${score}`;
    document
        .getElementById("nextBtn")
        .classList
        .remove("hidden");
}
function nextQuestion() {
    currentQuestion++;
    if (currentQuestion >= 10) {
        showResult();
    } else {
        loadQuestion();
    }
}
function showResult() {
    document
        .getElementById("quiz")
        .classList
        .add("hidden");
    document
        .getElementById("result")
        .classList
        .remove("hidden");
    document
        .getElementById("finalScore")
        .textContent =
        `${score} / 10`;
    let message = "";
    if (score === 10) {
        message =
            "🔥 Mükemmel! Hepsini bildin!";
    } else if (score >= 8) {
        message =
            "🏆 Çok iyi! İngilizcen sağlam.";
    } else if (score >= 6) {
        message =
            "👏 Güzel skor!";
    } else if (score >= 4) {
        message =
            "🙂 Fena değil! Biraz daha pratik yap.";
    } else {
        message =
            "😄 Bir tur daha dene!";
    }
    document
        .getElementById("message")
        .textContent =
        message;
    const storageKey =
        "englishHighScore_" +
        selectedLevel;
    let highScore =
        Number(
            localStorage.getItem(storageKey)
        ) || 0;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem(
            storageKey,
            highScore
        );
    }
    document
        .getElementById("highScore")
        .textContent =
        highScore;
}
function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    document
        .getElementById("result")
        .classList
        .add("hidden");
    document
        .getElementById("levelScreen")
        .classList
        .remove("hidden");
    document
        .querySelectorAll(".level-btn")
        .forEach(btn => {
            btn.classList.remove("active");
        });
}
</script>

</html>
