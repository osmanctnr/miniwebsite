<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniWeb - Futbol Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
    <div class="top">
        <span>⚽ Futbol Quiz</span>
        <span id="score">Skor: 0</span>
    </div>
    <div class="progress-bg">
        <div class="progress" id="progress"></div>
    </div>
    <h1 id="question">Soru yükleniyor...</h1>
    <div id="answers"></div>
    <p id="feedback"></p>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">
        Sonraki Soru →
    </button>
    <div class="result" id="result" style="display:none;">
        <h2>🏆 Quiz Bitti!</h2>
        <p class="final-score" id="finalScore"></p>
        <p class="record" id="record"></p>
        <button class="restart" onclick="restartQuiz()">
            🔄 Tekrar Oyna
        </button>
        <a href="index.html" class="home">
            🏠 Ana Sayfa
        </a>
    </div>
</div>
<script>
const questions = [
    {
        question: "2002 Dünya Kupası'nda gol kralı kim olmuştur?",
        answers: ["Ronaldo", "Miroslav Klose", "Thierry Henry", "David Beckham"],
        correct: 0
    },
    {
        question: "2010 Dünya Kupası'nı hangi ülke kazanmıştır?",
        answers: ["Almanya", "İspanya", "Hollanda", "Brezilya"],
        correct: 1
    },
    {
        question: "2006 Dünya Kupası'nda Altın Top ödülünü kim kazanmıştır?",
        answers: ["Zinedine Zidane", "Fabio Cannavaro", "Andrea Pirlo", "Ronaldinho"],
        correct: 0
    },
    {
        question: "2004 Avrupa Şampiyonası'nı hangi ülke kazanmıştır?",
        answers: ["Portekiz", "İtalya", "Yunanistan", "İspanya"],
        correct: 2
    },
    {
        question: "2005 Şampiyonlar Ligi finalinde Liverpool kimi yenerek kupayı kazanmıştır?",
        answers: ["Barcelona", "AC Milan", "Chelsea", "Real Madrid"],
        correct: 1
    },
    {
        question: "1998 Dünya Kupası finalinde Fransa hangi takımla karşılaşmıştır?",
        answers: ["Brezilya", "Arjantin", "İtalya", "Almanya"],
        correct: 0
    },
    {
        question: "\"Tanrı'nın Eli\" olarak bilinen golü atan futbolcu kimdir?",
        answers: ["Pelé", "Diego Maradona", "Johan Cruyff", "Rivaldo"],
        correct: 1
    },
    {
        question: "2014 Dünya Kupası'nı hangi ülke kazanmıştır?",
        answers: ["Arjantin", "Brezilya", "Almanya", "İspanya"],
        correct: 2
    },
    {
        question: "2008 Avrupa Şampiyonası'nı hangi ülke kazanmıştır?",
        answers: ["İspanya", "Almanya", "İtalya", "Fransa"],
        correct: 0
    },
    {
        question: "Lionel Messi 2023 yılında hangi kulübe transfer olmuştur?",
        answers: ["Al-Hilal", "Inter Miami", "Manchester City", "Paris Saint-Germain"],
        correct: 1
    }
];
let currentQuestion = 0;
let score = 0;
let answered = false;
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const scoreEl = document.getElementById("score");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const progressEl = document.getElementById("progress");
const resultEl = document.getElementById("result");
const finalScoreEl = document.getElementById("finalScore");
const recordEl = document.getElementById("record");
function loadQuestion() {
    answered = false;
    const q = questions[currentQuestion];
    questionEl.textContent = q.question;
    answersEl.innerHTML = "";
    feedbackEl.textContent = "";
    nextBtn.style.display = "none";
    const progressPercent =
        ((currentQuestion) / questions.length) * 100;
    progressEl.style.width = progressPercent + "%";
    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = answer;
        button.onclick = () => checkAnswer(index, button);
        answersEl.appendChild(button);
    });
    scoreEl.textContent = "Skor: " + score;
}
function checkAnswer(selected, button) {
    if (answered) return;
    answered = true;
    const correctAnswer = questions[currentQuestion].correct;
    const allButtons = document.querySelectorAll(".answer");
    allButtons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === correctAnswer) {
            btn.classList.add("correct");
        }
    });
    if (selected === correctAnswer) {
        score++;
        button.classList.add("correct");
        feedbackEl.textContent = "✅ Doğru!";
        feedbackEl.className = "correct-text";
    } else {
        button.classList.add("wrong");
        feedbackEl.textContent =
            "❌ Yanlış! Doğru cevap: " +
            questions[currentQuestion].answers[correctAnswer];
        feedbackEl.className = "wrong-text";
    }
    scoreEl.textContent = "Skor: " + score;
    nextBtn.style.display = "block";
}
function nextQuestion() {
    currentQuestion++;
    if (currentQuestion >= questions.length) {
        finishQuiz();
    } else {
        loadQuestion();
    }
}
function finishQuiz() {
    questionEl.style.display = "none";
    answersEl.style.display = "none";
    feedbackEl.style.display = "none";
    nextBtn.style.display = "none";
    progressEl.style.width = "100%";
    resultEl.style.display = "block";
    finalScoreEl.textContent =
        `${questions.length} soruda ${score} doğru yaptın!`;
    let highScore =
        Number(localStorage.getItem("footballHighScore")) || 0;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem(
            "footballHighScore",
            highScore
        );
        recordEl.textContent =
            "🔥 Yeni rekor! Tebrikler!";
    } else {
        recordEl.textContent =
            "🏆 Rekorun: " + highScore;
    }
}
function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    questionEl.style.display = "block";
    answersEl.style.display = "block";
    feedbackEl.style.display = "block";
    resultEl.style.display = "none";
    loadQuestion();
}
loadQuestion();
</script>
</body>
</html>
